version: "2"
sql:
  - engine: "sqlite"
    queries: "queries/"
    schema: "migrations/"
    gen:
      go:
        package: "dbgen"
        out: "dbgen/"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        json_tags_case_style: "snake"
        sql_package: "database/sql"
        overrides:
          # Never serialize the rejoin token: it is the account-takeover
          # credential and player structs are returned to other players
          # (session player lists, SSE broadcasts, etc).
          - column: "players.rejoin_token"
            go_struct_tag: 'json:"-"'
